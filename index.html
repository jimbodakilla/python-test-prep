<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive Python practice for 6th graders: print, input, int and float. Lessons, step-by-step code runner, drills, and a mock test.">
<meta name="color-scheme" content="light dark">
<title>Python Test Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234338ca'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='30' font-weight='700' fill='white' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4fb; --surface:#ffffff; --surface2:#f7f8ff; --ink:#151936; --muted:#575f87; --line:#e1e4f4;
  --primary:#4338ca; --primary-ink:#ffffff; --primary-soft:#e9e8fd; --focus:#f59e0b;
  --good:#15803d; --good-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7; --info-soft:#e0f2fe;
  --t-int:#1d4ed8; --t-int-bg:#dbeafe; --t-float:#0f766e; --t-float-bg:#ccfbf1; --t-str:#a16207; --t-str-bg:#fef3c7; --t-err:#b91c1c; --t-err-bg:#fee2e2;
  --code-bg:#0f1226; --code-ink:#e8eaff; --code-line:#262b55; --code-mut:#7d84b8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:16px; --shadow:0 1px 2px rgba(20,24,60,.06),0 10px 28px rgba(20,24,60,.07); --fs-code:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c0e1f; --surface:#161a35; --surface2:#1b2040; --ink:#eef0ff; --muted:#a3a9d6; --line:#2b3160;
  --primary:#8e8fff; --primary-ink:#0c0e1f; --primary-soft:#262a5c;
  --good:#4ade80; --good-soft:#12361f; --bad:#ff8a8a; --bad-soft:#401a1d; --warn:#fbbf24; --warn-soft:#3b2d0c; --info-soft:#0d2a3f;
  --t-int:#93c5fd; --t-int-bg:#16305e; --t-float:#5eead4; --t-float-bg:#0e3a3a; --t-str:#fcd34d; --t-str-bg:#3b2d0c; --t-err:#fca5a5; --t-err-bg:#4a1d20;
  --code-bg:#080a19; --code-line:#222750; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);}}
@media (pointer:coarse){:root{--fs-code:16px}}
*{box-sizing:border-box} html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;margin:0 0 .5em} h1{font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.02em} h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:.5em 0 .8em} a{color:var(--primary)} code{font-family:var(--mono);font-size:.92em;background:var(--primary-soft);padding:.08em .38em;border-radius:6px;white-space:pre-wrap}
pre{margin:0} .muted{color:var(--muted)} .small{font-size:.86rem} .center{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--primary-ink);padding:.6em 1em;z-index:100}.skip:focus{left:8px;top:8px}
main#view{max-width:980px;margin:0 auto;padding:18px 16px 110px;outline:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin:0 0 16px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--primary);margin:0 0 .4em}
.lead{font-size:1.08rem;color:var(--muted);max-width:60ch}

/* shell */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4338ca,#7c3aed);color:#fff;font:700 17px var(--mono);box-shadow:0 4px 12px rgba(67,56,202,.35)}
.brand-t{display:flex;flex-direction:column;line-height:1.1} .brand-t small{color:var(--muted);font-size:.74rem;margin-top:2px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-a{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.93rem;min-height:40px}
.nav-a:hover{background:var(--primary-soft);color:var(--ink)} .nav-a.on{background:var(--primary);color:var(--primary-ink)}
.xp-pill{font-weight:700;background:var(--warn-soft);color:var(--warn);padding:6px 12px;border-radius:99px;font-size:.88rem}
.foot{max-width:980px;margin:0 auto;padding:0 16px 90px;color:var(--muted);font-size:.84rem;text-align:center}
@media (max-width:760px){
  .top{padding:8px 12px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)} .brand-t small{display:none}
  .nav{position:fixed;bottom:0;left:0;right:0;margin:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;justify-content:space-around;flex-wrap:nowrap}
  .nav-a{flex-direction:column;gap:1px;padding:5px 2px;flex:1;font-size:.66rem;text-align:center;min-width:0;border-radius:10px;min-height:48px;justify-content:center}
  .nav-i{font-size:1.25rem} .xp-pill{margin-left:auto}
}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.55em 1.05em;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 .96rem var(--sans);cursor:pointer;text-decoration:none;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--primary);background:var(--primary-soft)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)} .btn.primary:hover{filter:brightness(1.1);background:var(--primary)}
.btn.ghost{background:transparent} .btn.big{padding:.7em 1.4em;font-size:1.04rem;min-height:50px} .btn.small{min-height:36px;padding:.3em .8em;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none} .btn:disabled:hover{background:var(--surface);border-color:var(--line)}.btn.primary:disabled:hover{background:var(--primary);border-color:var(--primary)}
.linkbtn{background:none;border:0;color:var(--primary);font:inherit;cursor:pointer;text-decoration:underline;padding:4px}.linkbtn.small{font-size:.86rem}
.chip{display:inline-flex;align-items:center;padding:.15em .65em;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-size:.78rem;font-weight:700;text-decoration:none}
.chip.big{font-size:.92rem;padding:.4em .9em;min-height:38px}.chip.lvl{background:transparent;color:var(--warn);letter-spacing:.1em}.chip.bonus{background:var(--warn-soft);color:var(--warn)}.chip.skill{background:var(--info-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}
.badge{display:inline-block;font:700 .74rem var(--mono);padding:.12em .55em;border-radius:99px;margin-left:6px;vertical-align:middle}
.b-int,.ty-int .opt-t{background:var(--t-int-bg);color:var(--t-int)} .b-float{background:var(--t-float-bg);color:var(--t-float)} .b-str{background:var(--t-str-bg);color:var(--t-str)} .b-err,.b-bool,.b-NoneType{background:var(--t-err-bg);color:var(--t-err)}
.ring{position:relative;display:inline-block}.ring-n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-n b{font-size:1.9rem;line-height:1}.ring-n span{font-size:.74rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:.7em 1.2em;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200}#toast.show{opacity:1;transform:translate(-50%,0)}

/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;background:linear-gradient(135deg,var(--surface),var(--primary-soft))}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hero-ring{display:flex;flex-direction:column;align-items:center;gap:8px}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero-ring{order:-1}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sec-h h2{margin:0}.sec-t{margin:26px 0 12px}
.skill-rows{display:grid;gap:8px;margin-top:10px}.skill-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 52px;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.skill-row b{text-align:right}.skill-row.link:hover span{color:var(--primary);text-decoration:underline}.skill-rows.big .skill-row{padding:5px 0}
.day{margin-top:14px}.day-h{margin-bottom:6px}.tasks{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.tasks a{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);min-height:48px}
.tasks a:hover{border-color:var(--primary);background:var(--primary-soft)}.tick{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-weight:900;flex:none;color:var(--primary-ink)}
.tasks .done .tick{background:var(--good);border-color:var(--good)}.tasks .done .tl{text-decoration:line-through;color:var(--muted)}.tl{flex:1}.tm{color:var(--muted);font-size:.82rem}
.rush ol{margin:.4em 0 0;padding-left:1.3em}.faq summary{cursor:pointer;font-weight:700}.faq ul{margin:.6em 0 0}.footnote{text-align:center;color:var(--muted);font-size:.84rem;margin-top:24px}
.page-h{margin:6px 0 20px}.page-h h1{margin-bottom:.2em}
.lessons-grid,.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lcard,.mode{display:flex;gap:14px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s;margin:0}.lcard:hover,.mode:hover,.unit:hover{transform:translateY(-2px);border-color:var(--primary)}
.l-ico,.m-ico{font-size:2rem;width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:var(--primary-soft);flex:none}.l-ico.big{width:72px;height:72px;font-size:2.6rem}
.l-n{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary)}.l-done{color:var(--good)}
.lcard h3,.mode h3{margin:.1em 0 .25em}.lcard p,.mode p{margin:.2em 0}.l-prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.8rem;color:var(--muted)}.l-prog .bar{flex:1}
.lcard.bonus,.unit.bonus{opacity:.88}.unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.unit{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;margin:0;transition:.15s}.u-top{display:flex;gap:8px;align-items:center}.u-emo{font-size:1.4rem}.u-title{font-weight:600;font-size:.92rem;min-height:2.6em}

/* lesson */
.lesson{max-width:780px;margin:0 auto}.crumbs{margin-bottom:8px}.l-head{display:flex;gap:16px;align-items:center;margin-bottom:12px}.l-head h1{margin-bottom:.15em}.l-head .lead{margin:.2em 0 0}
.l-h3{margin-top:1.6em;padding-top:.6em;border-top:2px dashed var(--line)}.lesson p{font-size:1.04rem}
.callout{border-radius:14px;padding:14px 16px;margin:14px 0;border:1.5px solid}.callout .co-h{font-weight:800;margin-bottom:4px}
.callout.rule{background:var(--good-soft);border-color:var(--good)}.callout.trap{background:var(--warn-soft);border-color:var(--warn)}.callout.tip{background:var(--info-soft);border-color:var(--line)}
.try{margin:18px 0}.try-h{font-weight:800;margin-bottom:6px;color:var(--primary)}
.show{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}.show-in{margin:8px 0 0;font-size:.88rem;color:var(--muted)}.show-in code{margin-left:4px}
.show-out{margin-top:8px;background:var(--code-bg);border-radius:10px;padding:10px 14px;color:#e8eaff;font-family:var(--mono);font-size:var(--fs-code)}.show-l{display:block;font:700 .68rem var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--code-mut);margin-bottom:4px}
.show-out pre{white-space:pre-wrap;font:inherit}.show-err{color:#ff9b9b;margin-top:6px;font-weight:700}
.tbl-wrap{overflow-x:auto;margin:12px 0}.tbl{border-collapse:collapse;width:100%;font-size:.95rem;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;background:var(--primary-soft);padding:9px 12px}.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.l-list{padding-left:1.2em}.l-list li{margin:.35em 0}
.pipeline{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:16px 0}.pstep{flex:1;min-width:120px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--line);background:var(--surface)}
.pstep b{font-size:.82rem;letter-spacing:.05em}.pstep code{align-self:flex-start}.pstep span{font-size:.84rem;color:var(--muted)}.arrow{align-self:center;font-size:1.4rem;color:var(--primary)}
.s1{border-color:#6366f1}.s2{border-color:#14b8a6}.s3{border-color:#f59e0b}.s4{border-color:#ec4899}
.quick{margin:18px 0}.quick-h{font-weight:800;color:var(--primary)}.quick-fb{margin-top:10px;padding:10px 12px;border-radius:10px;display:none}.quick-fb.show{display:block}.quick-fb.ok{background:var(--good-soft)}.quick-fb.no{background:var(--bad-soft)}
.cando .checks{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:8px}.cando label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.cando input{width:22px;height:22px;margin-top:2px;accent-color:var(--primary)}
.l-foot{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}

/* editor + terminal */
.playground{margin:6px 0}.pg-note{margin:0 0 8px;color:var(--muted)}
.pg-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.pg-grid{grid-template-columns:1fr}}
.compact .pg-grid{grid-template-columns:1fr}
.editor{background:var(--code-bg);border:1px solid var(--code-line);border-radius:12px;overflow:hidden;color:var(--code-ink)}
.ed-body{display:flex}.ed-gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--code-mut);font:var(--fs-code)/1.6 var(--mono);user-select:none;min-width:2.8em;border-right:1px solid var(--code-line);background:rgba(255,255,255,.02)}
.ed-gutter span{display:block;height:1.6em}.ed-gutter .g-err{color:#ff7b7b;font-weight:800}.ed-gutter .g-cur{color:#ffd479;font-weight:800}
.ed-scroll{flex:1;overflow-x:auto;overflow-y:hidden;min-width:0}.ed-inner{position:relative;min-width:100%;width:max-content}
.ed-hl,.ed-ta{margin:0;padding:12px 16px;font:var(--fs-code)/1.6 var(--mono);white-space:pre;tab-size:4;border:0;letter-spacing:0;word-spacing:0}
.ed-hl{display:block;pointer-events:none;color:var(--code-ink)}.ed-ta{position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:#fff;resize:none;overflow:hidden;outline:none}
.ed-ta::selection{background:rgba(142,143,255,.45);color:transparent}.ed-ta:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.ln{display:inline-block;min-width:100%}.ln-err{background:rgba(255,90,90,.24)}.ln-cur{background:rgba(255,212,121,.2)}
.tk-c{color:#7d84b8;font-style:italic}.tk-s{color:#a6e27c}.tk-n{color:#ffb86c}.tk-b{color:#82aaff;font-weight:600}.tk-k{color:#c792ea}.tk-o{color:#89ddff}.tk-fx{color:#ffcb6b}
.symbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-top:1px solid var(--code-line);background:rgba(255,255,255,.03)}.symlabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--code-mut);margin-right:2px}
.symkey{min-width:38px;height:38px;border-radius:9px;border:1px solid var(--code-line);background:#1a1f45;color:#e8eaff;font:700 1rem var(--mono);cursor:pointer}.symkey:active{background:var(--primary)}
@media (pointer:fine){.symbar{display:none}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.run-status{font-size:.88rem;color:var(--muted);margin-left:4px}
.term{background:#090b1d;color:#e8eaff;border:1px solid var(--code-line);border-radius:12px;padding:12px 14px;font:var(--fs-code)/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;min-height:96px;max-height:340px;overflow:auto}
.term-empty{color:var(--code-mut)}.term-typed{color:#ffd479}.term-in{font:inherit;background:#171b40;color:#ffd479;border:1.5px solid #4c52a8;border-radius:6px;padding:1px 6px;min-width:6ch;max-width:60%;outline:none}.term-in:focus{border-color:#ffd479}
.term-go{font:inherit;background:var(--primary);color:var(--primary-ink);border:0;border-radius:6px;padding:1px 9px;margin-left:6px;cursor:pointer;min-height:26px}
.term-err{margin-top:8px;padding:8px 10px;background:rgba(255,80,80,.14);border:1px solid rgba(255,107,107,.55);border-radius:8px;color:#ffb3b3}.term-err pre{white-space:pre-wrap;font:inherit}
.term-static{min-height:0}
.vars{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.vars-title{font:800 .7rem var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.vars-empty{font-size:.88rem;color:var(--muted)}.var{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--surface2);margin:4px 0;font-family:var(--mono);font-size:.92rem;flex-wrap:wrap}
.var-name{font-weight:800}.var-eq{color:var(--muted)}.var-val{padding:1px 8px;border-radius:7px;font-weight:700}.v-int{background:var(--t-int-bg);color:var(--t-int)}.v-float{background:var(--t-float-bg);color:var(--t-float)}.v-str{background:var(--t-str-bg);color:var(--t-str)}
.var-new{animation:flash 1s}@keyframes flash{0%{box-shadow:0 0 0 3px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.explain{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);border:1.5px solid var(--bad)}.explain.show{display:block}.explain p{margin:.3em 0}.ex-h{font-weight:800;color:var(--bad)}.ex-h span{font-weight:500;color:var(--muted)}
.pg-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.pg-bar select{font:inherit;padding:.5em .7em;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:42px}
.codeblock{display:flex;background:var(--code-bg);border:1px solid var(--code-line);border-radius:12px;overflow-x:auto;margin:10px 0;color:var(--code-ink)}.codeblock.compact{margin:6px 0}
.cb-gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--code-mut);font:var(--fs-code)/1.6 var(--mono);user-select:none;border-right:1px solid var(--code-line);min-width:2.8em}.cb-gutter span{display:block}
.cb-code{padding:12px 16px;font:var(--fs-code)/1.6 var(--mono);white-space:pre;flex:1}.blank{background:#3a3f8f;color:#fff;border-radius:6px;padding:0 6px;border:2px dashed #aab;font-weight:800}.blank.filled{border-style:solid;border-color:#ffd479;color:#ffd479}

/* questions */
.session{max-width:820px;margin:0 auto}.sess-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.back{font-weight:700;text-decoration:none}.sess-title{font-weight:800;flex:1;min-width:140px}

<script>
/* core: tiny DOM helper, storage, RNG, syntax highlighter, friendly error explainer */
'use strict';
const D = window.PYDATA;
const PF = window.PyFun;
const ITEMS = D.items;
const BYID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const SKILL_NAMES = D.skills;
const CORE_SKILLS = ['print', 'join', 'math', 'input', 'convert', 'types', 'errors', 'programs'];

/* ---------- DOM ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));

}
const $ = (s, el = document) => el.querySelector(s);

/* ---------- storage (never trust it to exist) ---------- */
const Store = {
  key: 'pyprep.v1', data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) { d = null; }
    if (!d || typeof d !== 'object') d = {};
    d.items = d.items || {}; d.lessons = d.lessons || {}; d.sessions = d.sessions || []; d.mocks = d.mocks || [];
    d.xp = d.xp || 0; d.best = d.best || {}; d.visited = d.visited || {}; d.plan = d.plan || {};
    this.data = d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* private mode: keep in memory */ } },
  record(id, ok) {
    if (String(id)[0] === 'g') return;            // generated questions are not tracked
    const r = this.data.items[id] || { n: 0, right: 0, ever: false };
    r.n++; if (ok) { r.right++; r.ever = true; } r.last = ok; r.ts = Date.now();
    this.data.items[id] = r; this.save();
  },
  addXp(n) { this.data.xp += n; this.save(); },
  reset() { this.data = null; try { localStorage.removeItem(this.key); } catch (e) {} this.load(); },

Store.load();

/* ---------- RNG ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const pick = (arr, r = R) => arr[Math.floor(r() * arr.length)];
const randInt = (a, b, r = R) => a + Math.floor(r() * (b - a + 1));

/* ---------- text normalising (same rule the build used for answer keys) ---------- */
function norm(s) { return String(s).replace(/\r/g, '').split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, ''); }

/* ---------- mastery ---------- */
function skillStats() {
  const out = {};
  for (const s of CORE_SKILLS) out[s] = { total: 0, solved: 0, tried: 0, wrongNow: 0 };
  for (const it of ITEMS) {
    const st = out[it.skill]; if (!st) continue;
    st.total++;
    const r = Store.data.items[it.id];
    if (r) { st.tried++; if (r.last) st.solved++; else st.wrongNow++; }
  }
  for (const s of CORE_SKILLS) { const st = out[s]; st.mastery = Math.min(1, st.solved / Math.min(st.total, 12)); }
  return out;
}
function overallReadiness() {
  const st = skillStats(); return CORE_SKILLS.reduce((a, s) => a + st[s].mastery, 0) / CORE_SKILLS.length;
}
function unitStats(u) {
  const its = ITEMS.filter(i => i.unit === u);
  let solved = 0, tried = 0;
  for (const it of its) { const r = Store.data.items[it.id]; if (r) { tried++; if (r.last) solved++; } }
  return { total: its.length, solved, tried, mastery: Math.min(1, solved / Math.min(its.length, 15)) };
}

/* ---------- syntax highlighting ---------- */
const BUILTINS = new Set(['print', 'input', 'int', 'float', 'str', 'type', 'round', 'abs', 'len', 'max', 'min']);
const CONSTS = new Set(['True', 'False', 'None']);
const HL_RE = /(#.*$)|([fFrR]{0,2}(?:"(?:\\.|[^"\\])*(?:"|$)|'(?:\\.|[^'\\])*(?:'|$)))|(\b\d+\.?\d*(?:[eE][+-]?\d+)?\b|\.\d+)|([A-Za-z_][A-Za-z_0-9]*)|(\*\*|\/\/|[+\-*\/%=<>!]=?)/g;
function hlLine(line) {
  let out = '', last = 0, m; HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(line))) {
    out += esc(line.slice(last, m.index)); last = m.index + m[0].length;
    if (m[1] != null) out += `<span class="tk-c">${esc(m[1])}</span>`;
    else if (m[2] != null) {
      let s = esc(m[2]);
      if (/^[fF]/.test(m[2])) s = s.replace(/\{[^{}]*\}/g, x => `<span class="tk-fx">${x}</span>`);
      out += `<span class="tk-s">${s}</span>`;
    } else if (m[3] != null) out += `<span class="tk-n">${esc(m[3])}</span>`;
    else if (m[4] != null) out += BUILTINS.has(m[4]) ? `<span class="tk-b">${m[4]}</span>` : CONSTS.has(m[4]) ? `<span class="tk-k">${m[4]}</span>` : esc(m[4]);
    else out += `<span class="tk-o">${esc(m[5])}</span>`;
  }

}
function highlight(code, errLine, curLine) {
  return code.split('\n').map((ln, i) =>

}
function codeBlock(code, opts = {}) {
  const lines = code.split('\n');
  const el = h('div', { class: 'codeblock' + (opts.compact ? ' compact' : '') },
    h('div', { class: 'cb-gutter', 'aria-hidden': 'true' }, lines.map((_, i) => h('span', null, String(i + 1)))),

}

    }

// spread over kinds, easy -> hard, prefer unseen/missed items
function mixPool(pool, n) {
  const weight = it => { const r = Store.data.items[it.id]; return !r ? 3 : r.last ? 1 : 4; };
  const bag = shuffle(pool).map(it => ({ it, w: weight(it) + R() * 2 })).sort((a, b) => b.w - a.w);
  const chosen = []; const kinds = {};
  for (const { it } of bag) { if (chosen.length >= n) break; if ((kinds[it.kind] || 0) >= Math.ceil(n / 3)) continue; chosen.push(it); kinds[it.kind] = (kinds[it.kind] || 0) + 1; }
  for (const { it } of bag) { if (chosen.length >= n) break; if (!chosen.includes(it)) chosen.push(it); }

}
function weakItems(n = 14) {

    const bySkill = {}; for (const it of pool) (bySkill[it.skill] = bySkill[it.skill] || []).push(it);

async function typeOf(expr, setup, stdin) {

}
function whyType(expr, ans) {

    if (/(int|float)\("[a-z]+"\)/.test(expr)) return 'A word is not a number, so converting crashes (ValueError).';
    if (/"[^"]*"\s*\*\s*"/.test(expr)) return 'You cannot multiply text by text.';
    return 'Text and numbers cannot be mixed with + (TypeError).';
  }
  if (ans === 'float') {
    if (/ \/ /.test(expr)) return '/ ALWAYS gives a float, even when it divides evenly.';
    if (/float\(/.test(expr)) return 'float() makes a float.';
    return 'A float is in the math (a number with a decimal point), so the answer is a float.';
  }
  if (ans === 'str') {
    if (/input\(\)/.test(expr) || /^x/.test(expr)) return 'input() always gives text (str), so it stays text unless you convert it.';
    return 'Quotes mean text (str). Text + text glues, text * number repeats - still text.';
  }

}

print("Sum:", a + b)</pre>`),
    sec('8 · On test day', `<ol><li>Quotes or not? (text vs math)</li><li>Did this number come from <code>input()</code>? It is text until converted.</li><li>Is there a <code>/</code>? The answer is a float and ends in <code>.0</code> if whole.</li><li>Match the example output exactly: spaces and capitals.</li><li>If it crashes: error name → line number → what does it mean?</li><li>Run your program in your head with the example input.</li></ol>`));
  return root;
}

/* app: router + shell */
'use strict';
const NAV = [['#/', 'Home', '🏠'], ['#/learn', 'Learn', '📘'], ['#/practice', 'Practice', '💪'], ['#/test', 'Mock test', '📝'], ['#/play', 'Playground', '🧪'], ['#/cheat', 'Cheat sheet', '📋']];
let navEl;
function buildShell() {
  const app = $('#app'); app.textContent = '';
  navEl = h('nav', { class: 'nav', 'aria-label': 'Main' },
    NAV.map(n => h('a', { href: n[0], class: 'nav-a', dataset: { to: n[0] } }, h('span', { class: 'nav-i', 'aria-hidden': 'true' }, n[2]), h('span', { class: 'nav-t' }, n[1]))));
  app.append(
    h('a', { class: 'skip', href: '#view', onclick: e => { e.preventDefault(); $('#view').focus(); } }, 'Skip to content'),
    h('header', { class: 'top' }, h('a', { class: 'brand', href: '#/', 'aria-label': 'Python Test Prep home' },
      h('span', { class: 'logo', 'aria-hidden': 'true' }, '>_'), h('span', { class: 'brand-t' }, h('b', null, 'Python Test Prep'), h('small', null, 'print · input · int · float'))), navEl, h('div', { class: 'xp-pill', id: 'xp', title: 'Experience points' })),
    h('main', { id: 'view', tabindex: '-1' }),
    h('footer', { class: 'foot' }, 'Made for 6th-grade Python learners. Answers are checked against real Python. No sign-in, nothing leaves your device.'));
}
function setActive(hash) {
  $$('.nav-a', navEl).forEach(a => {
    const to = a.dataset.to; const on = to === '#/' ? (hash === '#/' || hash === '' || hash === '#') : hash.startsWith(to) || (to === '#/practice' && /^#\/(drill|skill|weak|mixed|kind|endless|sprint)/.test(hash)) || (to === '#/test' && hash.startsWith('#/test'));
    a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  const xp = $('#xp'); if (xp) xp.textContent = '⭐ ' + Store.data.xp;
}
async function route() {
  const hash = location.hash || '#/'; const view = $('#view'); view.textContent = '';
  const parts = hash.replace(/^#\/?/, '').split('/'); const [a, b] = parts;
  let node, title = 'Python Test Prep';
  try {
    if (!a) node = HomeView();
    else if (a === 'learn') { node = b ? LessonView(+b) : LearnView(); title = b ? 'Lesson ' + b : 'Lessons'; }
    else if (a === 'practice') { node = PracticeView(); title = 'Practice'; }
    else if (a === 'drill') { const u = +b; const l = D.lessons.find(x => x.n === u); node = PracticeSession({ title: `Unit ${u} drill · ${l ? l.title.split(' - ')[0] : ''}`, items: itemsForUnit(u, u === 6 ? 12 : 14), meta: { kind: 'unit', unit: u }, backHref: '#/learn/' + u, backLabel: 'Lesson' }); }
    else if (a === 'skill') { const pool = ITEMS.filter(i => i.skill === b); node = PracticeSession({ title: SKILL_NAMES[b] || b, items: mixPool(pool, 14), meta: { kind: 'skill' } }); }
    else if (a === 'weak') { const w = weakItems(14); node = PracticeSession({ title: 'Weak-spot rescue', items: w.items, meta: { kind: 'weak' } }); }
    else if (a === 'mixed') { node = PracticeSession({ title: 'Mixed practice', items: mixPool(ITEMS.filter(i => i.unit <= 6), 15), meta: { kind: 'mixed' } }); }
    else if (a === 'kind') { const k = b === 'write' ? 'write' : 'fix'; node = PracticeSession({ title: k === 'fix' ? 'Bug hunt' : 'Code writer', items: mixPool(ITEMS.filter(i => i.kind === k && i.unit <= 6), 8), meta: { kind: k } }); }
    else if (a === 'endless') { node = await EndlessSession(12); }
    else if (a === 'sprint') { node = await TypeSprint(); }
    else if (a === 'test') { node = b ? MockTest({ n: +b >= 20 ? 20 : 10, minutes: +b >= 20 ? 30 : 15 }) : TestHubView(); title = 'Mock test'; }
    else if (a === 'play') { node = PlayView(); title = 'Playground'; }
    else if (a === 'cheat') { node = CheatView(); title = 'Cheat sheet'; }
    else node = h('div', { class: 'card' }, 'Page not found. ', h('a', { href: '#/' }, 'Go home'));
  } catch (err) {
    console.error(err); node = h('div', { class: 'card' }, h('h2', null, 'Oops, something broke'), h('p', null, String(err && err.message || err)), h('a', { class: 'btn', href: '#/' }, 'Home'));
  }
  view.append(node); document.title = title === 'Python Test Prep' ? title : title + ' · Python Test Prep'; setActive(hash);
  window.scrollTo(0, 0);
}
window.route = route;
window.addEventListener('hashchange', route);
window.addEventListener('error', e => console.error('window error', e.message));
buildShell(); route();

</script>
