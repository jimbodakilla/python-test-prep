: "", "id": "11.63", "expect": ["[3, 1, 2]", "[7]", "[1, 2, 3, 4, 5]", "[5, 4]"]}, {"kind": "write", "unit": 11, "prompt": "Read <b>5 different whole numbers</b>. Print the <b>second largest</b>. (5 9 1 7 3 prints 7)", "solution": "nums = []\nfor i in range(5):\n    nums.append(int(input()))\nnums.sort()\nprint(nums[-2])", "tests": [{"stdin": ["5", "9", "1", "7", "3"], "expect": "7"}, {"stdin": ["9", "8", "7", "6", "5"], "expect": "8"}, {"stdin": ["1", "2", "3", "4", "5"], "expect": "4"}, {"stdin": ["-5", "-2", "-9", "-1", "-7"], "expect": "-2"}], "hints": ["Put the numbers in a list.", "After sort(), the largest is nums[-1]. Which one is second?"], "why": "Sort the list; the biggest is last, so the second largest is at index -2.", "skill": "lists", "level": 3, "alts": ["nums = []\nfor i in range(5):\n    nums.append(int(input()))\nprint(sorted(nums)[-2])", "nums = []\nfor i in range(5):\n    nums.append(int(input()))\nnums.sort(reverse=True)\nprint(nums[1])", "nums = []\nfor i in range(5):\n    nums.append(int(input()))\nnums.remove(max(nums))\nprint(max(nums))"], "must": [["\\.append\\s*\\(", "Put the numbers in a list with append."]], "starter": "", "id": "11.64", "expect": ["7", "8", "4", "-2"]}, {"kind": "write", "unit": 11, "prompt": "Read a number <b>n</b>. Print a list of the <b>first n square numbers</b> (1, 4, 9 ...). (5 prints [1, 4, 9, 16, 25])", "solution": "n = int(input())\nsquares = []\nfor i in range(1, n + 1):\n    squares.append(i * i)\nprint(squares)", "tests": [{"stdin": ["5"], "expect": "[1, 4, 9, 16, 25]"}, {"stdin": ["1"], "expect": "[1]"}, {"stdin": ["3"], "expect": "[1, 4, 9]"}, {"stdin": ["0"], "expect": "[]"}], "hints": ["Start with squares = [].", "range(1, n + 1) gives 1 up to n."], "why": "Loop i from 1 to n, and append i * i each time. For n = 0 the loop never runs and the list stays empty.", "skill": "lists", "level": 2, "alts": ["n = int(input())\nsquares = []\nfor i in range(n):\n    squares.append((i + 1) * (i + 1))\nprint(squares)", "n = int(input())\nsquares = []\ni = 1\nwhile i <= n:\n    squares.append(i ** 2)\n    i += 1\nprint(squares)"], "must": [["\\.append\\s*\\(", "Build the list with append."]], "starter": "", "id": "11.65", "expect": ["[1, 4, 9, 16, 25]", "[1]", "[1, 4, 9]", "[]"]}, {"kind": "write", "unit": 11, "prompt": "Read <b>4 prices</b> (decimals, one per line) into a list. Print how many items there are, then the total with 2 decimals, like this:<br><code>Items: 4</code><br><code>Total: 7.25</code>", "solution": "prices = []\nfor i in range(4):\n    prices.append(float(input()))\ntotal = sum(prices)\nprint(\"Items:\", len(prices))\nprint(f\"Total: {total:.2f}\")", "tests": [{"stdin": ["2.5", "1.25", "3", "0.5"], "expect": "Items: 4\nTotal: 7.25"}, {"stdin": ["0", "0", "0", "0"], "expect": "Items: 4\nTotal: 0.00"}, {"stdin": ["10", "10", "10", "10"], "expect": "Items: 4\nTotal: 40.00"}, {"stdin": ["0.75", "0.5", "0.25", "1"], "expect": "Items: 4\nTotal: 2.50"}], "hints": ["Use float(input()) so decimals work.", "f\"Total: {total:.2f}\" prints 2 decimals."], "why": "append each price, then len gives the item count and sum gives the total.", "skill": "lists", "level": 3, "alts": ["prices = []\nfor i in range(4):\n    prices.append(float(input()))\ntotal = 0\nfor p in prices:\n    total += p\nprint(\"Items:\", len(prices))\nprint(f\"Total: {total:.2f}\")"], "must": [["\\.append\\s*\\(", "Build the list with append."]], "starter": "", "id": "11.66", "expect": ["Items: 4\nTotal: 7.25", "Items: 4\nTotal: 0.00", "Items: 4\nTotal: 40.00", "Items: 4\nTotal: 2.50"]}, {"kind": "write", "unit": 11, "prompt": "Read a sentence. Print its words joined with a dash <code>-</code>. (red green blue prints red-green-blue)", "solution": "words = input().split()\nprint(\"-\".join(words))", "tests": [{"stdin": ["red green blue"], "expect": "red-green-blue"}, {"stdin": ["hello"], "expect": "hello"}, {"stdin": ["a b"], "expect": "a-b"}, {"stdin": ["one two three four five"], "expect": "one-two-three-four-five"}], "hints": ["split() makes the list.", "\"-\".join(list) glues it back."], "why": "split() turns the sentence into a list and \"-\".join puts the dashes between the items.", "skill": "lists", "level": 2, "alts": ["print(\"-\".join(input().split()))"], "must": [["\\.join\\s*\\(", "Use join."]], "starter": "", "id": "11.67", "expect": ["red-green-blue", "hello", "a-b", "one-two-three-four-five"]}, {"kind": "know", "unit": 11, "q": "What is the index of the FIRST item in a list?", "opts": ["0", "1", "-1", "10"], "why": "Python counts from 0, so the first box is index 0 and the last box of a 3-item list is index 2.", "skill": "lists", "code": "", "level": 1, "id": "11.68"}, {"kind": "know", "unit": 11, "q": "A list has 5 items. What is the biggest valid index?", "opts": ["4", "5", "6", "1"], "why": "The indexes are 0, 1, 2, 3, 4. Index 5 would raise an IndexError.", "skill": "lists", "code": "", "level": 1, "id": "11.69"}, {"kind": "know", "unit": 11, "q": "What is the difference between append and insert?", "opts": ["append adds at the end; insert picks the position", "append adds at the start; insert adds at the end", "append copies the list; insert changes the list", "They do exactly the same thing in Python"], "why": "a.append(x) always goes to the end. a.insert(i, x) puts x at index i and shifts the others along.", "skill": "lists", "code": "", "level": 2, "id": "11.70"}, {"kind": "know", "unit": 11, "q": "What does a.sort() return?", "opts": ["None, because it sorts the list in place", "A new list in sorted order", "The smallest item in the list", "The same list but backwards"], "why": "sort() changes a itself and returns None. That is why x = a.sort() leaves x empty-handed. Use sorted(a) to get a new list.", "skill": "lists", "code": "", "level": 2, "id": "11.71"}, {"kind": "know", "unit": 11, "q": "After b = a (a is a list), what is true?", "opts": ["a and b are two names for the same list", "b is a separate copy of the list a", "b holds only the first item of a", "Python shows a TypeError right away"], "why": "Assignment never copies a list. To get a copy, write b = a.copy().", "skill": "lists", "code": "", "level": 3, "id": "11.72"}, {"kind": "know", "unit": 11, "q": "When should you use for i in range(len(a)) instead of for x in a?", "opts": ["When you need the position of each item", "When the list has more than ten items", "When every item in the list is a number", "Never, because both always work the same"], "why": "for x in a only gives the values. range(len(a)) gives the positions, which you need for a[i] = ... or for printing the index.", "skill": "lists", "code": "", "level": 2, "id": "11.73"}, {"kind": "out", "unit": 12, "code": "def hello():\n    print(\"Hello!\")\nprint(\"Start\")", "why": "The def only teaches Python what hello() means. Nothing calls hello(), so \"Hello!\" is never printed. Only print(\"Start\") runs.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.1", "options": ["Start", "Hello!\nStart", "Start\nHello!", "Hello!"]}, {"kind": "out", "unit": 12, "code": "def cheer():\n    print(\"Go team!\")\ncheer()\ncheer()", "why": "The def runs nothing. Each call cheer() runs the body once. Two calls means \"Go team!\" printed twice.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.2", "options": ["Go team!\nGo team!", "Go team!", "Go team!\nGo team!\nGo team!", "Error: NameError"]}, {"kind": "out", "unit": 12, "code": "hello()\ndef hello():\n    print(\"Hi!\")", "why": "Python reads from the top. When it reaches hello() on line 1, the def on line 2 has not run yet, so the name hello does not exist: NameError.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.3", "options": ["Error: NameError", "Hi!", "Error: SyntaxError", "Error: TypeError"]}, {"kind": "out", "unit": 12, "code": "def greet(name):\n    print(\"Hello,\", name)\ngreet(\"Ana\")\ngreet(\"Leo\")", "why": "name is a parameter. Each call fills it in: first name = \"Ana\", then name = \"Leo\". So the body prints a different name each time.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.4", "options": ["Hello, Ana\nHello, Leo", "Hello, name\nHello, name", "Hello, Ana", "Hello, Leo\nHello, Ana"]}, {"kind": "out", "unit": 12, "code": "def show(a, b):\n    print(a - b)\nshow(10, 4)\nshow(4, 10)", "why": "Arguments go to the parameters IN ORDER. show(10, 4) makes a=10, b=4, so 10 - 4 = 6. show(4, 10) makes a=4, b=10, so 4 - 10 = -6.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.5", "options": ["6\n-6", "6\n6", "-6\n6", "14\n14"]}, {"kind": "out", "unit": 12, "code": "def add(a, b):\n    return a + b\nx = add(2, 3)\nprint(x)", "why": "return hands the answer 5 back to the line that called add. So x = 5 and print(x) shows 5.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.6", "options": ["5", "None", "2 3", "a + b"]}, {"kind": "out", "unit": 12, "code": "def add(a, b):\n    print(a + b)\nx = add(2, 3)\nprint(x)", "why": "add(2, 3) PRINTS 5 while it runs, but it has no return, so it gives back None. Then x = None and print(x) shows None. Two lines: 5 and None.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.7", "options": ["5\nNone", "5", "None", "5\n5"]}, {"kind": "out", "unit": 12, "code": "def f():\n    x = 5\nprint(f())", "why": "f() has no return, so it gives back None. print(f()) prints that None. (The x = 5 is local and is not given back.)", "stdin": [], "skill": "funcs", "level": 1, "id": "12.8", "options": ["None", "5", "0", "Error: NameError"]}, {"kind": "out", "unit": 12, "code": "def test():\n    return \"A\"\n    print(\"B\")\nprint(test())", "why": "return ends the function at once. The line print(\"B\") comes after it and never runs. test() gives back \"A\" and print shows A.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.9", "options": ["A", "A\nB", "B", "None"]}, {"kind": "out", "unit": 12, "code": "def power(base, exp=2):\n    return base ** exp\nprint(power(5))\nprint(power(2, 3))", "why": "power(5) uses the default exp=2, so 5 ** 2 = 25. power(2, 3) replaces the default: 2 ** 3 = 8.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.10", "options": ["25\n8", "10\n6", "25\n25", "Error: TypeError"]}, {"kind": "out", "unit": 12, "code": "def hello(name=\"friend\"):\n    print(\"Hi\", name)\nhello()\nhello(\"Mia\")", "why": "hello() gives no argument, so name keeps its default \"friend\". hello(\"Mia\") replaces the default with \"Mia\".", "stdin": [], "skill": "funcs", "level": 1, "id": "12.11", "options": ["Hi friend\nHi Mia", "Hi name\nHi Mia", "Hi\nHi Mia", "Hi friend\nHi friend"]}, {"kind": "out", "unit": 12, "code": "def add(a, b):\n    return a + b\nprint(add(5))", "why": "add needs 2 arguments but the call gives only 1. b gets no value, so Python raises a TypeError (missing 1 required positional argument).", "stdin": [], "skill": "funcs", "level": 1, "id": "12.12", "options": ["Error: TypeError", "5", "None", "Error: NameError"]}, {"kind": "out", "unit": 12, "code": "def make():\n    secret = 42\nmake()\nprint(secret)", "why": "secret is made INSIDE make(), so it only exists while make() runs. Outside the function the name secret does not exist: NameError.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.13", "options": ["Error: NameError", "42", "None", "Error: TypeError"]}, {"kind": "out", "unit": 12, "code": "x = 10\ndef change():\n    x = 99\nchange()\nprint(x)", "why": "Assigning x = 99 inside the function makes a NEW local x. The outside x is a different variable and stays 10.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.14", "options": ["10", "99", "None", "Error: UnboundLocalError"]}, {"kind": "out", "unit": 12, "code": "count = 0\ndef add_one():\n    count += 1\nadd_one()\nprint(count)", "why": "count += 1 means count = count + 1. Because the function assigns count, Python treats it as a local variable that has no value yet: UnboundLocalError.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.15", "options": ["Error: UnboundLocalError", "1", "0", "Error: NameError"]}, {"kind": "out", "unit": 12, "code": "def shout(word):\n    word = word + \"!\"\nshout(\"hey\")\nprint(word)", "why": "word is a parameter, so it is local to shout. It does not exist outside the function. print(word) fails with NameError.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.16", "options": ["Error: NameError", "hey!", "hey", "None"]}, {"kind": "out", "unit": 12, "code": "rate = 3\ndef triple_it(n):\n    return n * rate\nprint(triple_it(4))", "why": "A function may READ a global variable. rate is 3, so it returns 4 * 3 = 12.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.17", "options": ["12", "4", "7", "Error: NameError"]}, {"kind": "out", "unit": 12, "code": "def grade(score):\n    if score >= 90:\n        return \"A\"\n    if score >= 80:\n        return \"B\"\n    return \"C\"\nprint(grade(95), grade(85), grade(10))", "why": "grade(95) hits the first return: \"A\". grade(85) fails the first test, passes the second: \"B\". grade(10) falls to the last return: \"C\". A comma in print separates with spaces: A B C.", "stdin": [], "skill": "funcs", "level": 3, "id": "12.18", "options": ["A B C", "A\nB\nC", "A B", "A A C"]}, {"kind": "out", "unit": 12, "code": "def square(n):\n    print(n * n)\nprint(square(3) + 1)", "why": "square(3) PRINTS 9 first. But it returns None, so None + 1 fails with TypeError. The output is 9 and then the error.", "stdin": [], "skill": "funcs", "level": 3, "id": "12.19", "options": ["9\nError: TypeError", "10", "9", "9\n10"]}, {"kind": "out", "unit": 12, "code": "def hi():\nprint(\"Hi\")\nhi()", "why": "The body of a def must be indented. print(\"Hi\") is not indented, so Python stops with an IndentationError before running anything.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.20", "options": ["Error: IndentationError", "Hi", "Error: SyntaxError", "Error: NameError"]}, {"kind": "out", "unit": 12, "code": "def hi()\n    print(\"Hi\")\nhi()", "why": "The def line must end with a colon. Without it Python cannot read the program at all: SyntaxError.", "stdin": [], "skill": "funcs", "level": 1, "id": "12.21", "options": ["Error: SyntaxError", "Hi", "Error: IndentationError", "Error: NameError"]}, {"kind": "typed", "unit": 12, "code": "def welcome():\n    print(\"Welcome!\")\nwelcome\nprint(\"Done\")", "why": "welcome without brackets only NAMES the function, it does not call it. So only print(\"Done\") runs.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.22", "answer": "Done"}, {"kind": "typed", "unit": 12, "code": "def take(a, b):\n    return a - b\nprint(take(b=1, a=10))", "why": "Keyword arguments match by NAME, not by position: a=10, b=1, so 10 - 1 = 9.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.23", "answer": "9"}, {"kind": "typed", "unit": 12, "code": "def welcome(name):\n    return \"Hello, \" + name + \"!\"\nprint(welcome(input()))", "why": "The function returns the text \"Hello, Mia!\" and print shows it.", "stdin": ["Mia"], "skill": "funcs", "level": 1, "id": "12.24", "answer": "Hello, Mia!"}, {"kind": "typed", "unit": 12, "code": "def area(w, h):\n    return w * h\na = int(input())\nb = int(input())\nprint(area(a, b))", "why": "a=3 and b=5 go to w and h in order. The function returns 3 * 5 = 15.", "stdin": ["3", "5"], "skill": "funcs", "level": 1, "id": "12.25", "answer": "15"}, {"kind": "typed", "unit": 12, "code": "def tip(bill, percent=10):\n    return bill * percent / 100\nprint(tip(50))\nprint(tip(50, 20))", "why": "tip(50) uses percent=10: 50 * 10 / 100 = 5.0. tip(50, 20): 50 * 20 / 100 = 10.0. The / always gives a float.", "stdin": [], "skill": "funcs", "level": 2, "id": "12.26", "answer": "5.0\n10.0"}, {"kind": "typed", "unit": 12, "code": "def inc(n):\n    return n + 1\ndef twice(n):\n    return inc(inc(n))\nx = twice(5)\nprint(x, twice(x))", "why": "twice(5): inc(5) = 6, inc(6) = 7, so x = 7. twice(7) = 9. print with a comma shows 7 9.", "stdin": [], "skill": "funcs", "level": 3, "id": "12.27", "answer": "7 9"}, {"kind": "typed", "unit": 12, "code": "def total(nums):\n    t = 0\n    for n in nums:\n        t += n\n    return t\nprint(total([2, 4, 6]))", "why": "The loop adds 2, then 4, then 6 into t: 2, 6, 12. The function returns 12.", "stdin": [], "skill": "funcs", "level": 3, "id": "12.28", "answer": "12"}, {"kind": "ty", "unit": 12, "expr": "add(2, 3)", "setup": "def add(a, b):\n    return a + b", "why": "add(2, 3) gives 5 (int). The function RETURNS a + b, which is the whole number 5, so you get an int.", "stdin": [], "skill": "funcs", "level": 1, "choices": ["int", "str", "NoneType", "Error"], "id": "12.29", "answer": "int"}, {"kind": "ty", "unit": 12, "expr": "shout(\"hi\")", "setup": "def shout(word):\n    return word + \"!\"", "why": "shout(\"hi\") gives 'hi!' (str). The function returns the text \"hi!\" so the type is str.", "stdin": [], "skill": "funcs", "level": 1, "choices": ["int", "str", "NoneType", "Error"], "id": "12.30", "answer": "str"}, {"kind": "ty", "unit": 12, "expr": "nothing(4)", "setup": "def nothing(n):\n    x = n + 1", "why": "nothing(4) gives None (NoneType). nothing() has no return statement, so it gives back None. The type of None is NoneType.", "stdin": [], "skill": "funcs", "level": 1, "choices": ["int", "str", "NoneType", "Error"], "id": "12.31", "answer": "NoneType"}, {"kind": "ty", "unit": 12, "expr": "add(2)", "setup": "def add(a, b):\n    return a + b", "why": "add(2) gives 💥 TypeError. add needs two arguments and only one is given: TypeError, so there is no value at all.", "stdin": [], "skill": "funcs", "level": 2, "choices": ["int", "str", "NoneType", "Error"], "id": "12.32", "answer": "Error"}, {"kind": "ty", "unit": 12, "expr": "average(4, 6)", "setup": "def average(a, b):\n    return (a + b) / 2", "why": "The / operator always gives a float, so (4 + 6) / 2 = 5.0 is a float, even though it looks whole.", "stdin": [], "skill": "funcs", "level": 2, "choices": ["int", "float", "str", "NoneType"], "id": "12.33", "answer": "float"}, {"  12, "prompt": "Write a function <code>max_of_three(a, b, c)</code> that returns the biggest of three numbers. Ask for three whole numbers and print the biggest. Typing 3, 9 and 5 prints 9.", "solution": "def max_of_three(a, b, c):\n    return max(a, b, c)\nx = int(input())\ny = int(input())\nz = int(input())\nprint(max_of_three(x, y, z))", "tests": [{"stdin": ["3", "9", "5"], "expect": "9"}, {"stdin": ["7", "7", "7"], "expect": "7"}, {"stdin": ["10", "2", "1"], "expect": "10"}, {"stdin": ["-1", "-5", "-3"], "expect": "-1"}], "hints": ["The built-in max() can take three values.", "Or compare with if / elif inside the function."], "why": "Whatever the order, the function returns the biggest of the three; equal numbers are fine.", "skill": "funcs", "level": 3, "alts": ["def max_of_three(a, b, c):\n    biggest = a\n    if b > biggest:\n        biggest = b\n    if c > biggest:\n        biggest = c\n    return biggest\nx = int(input())\ny = int(input())\nz = int(input())\nprint(max_of_three(x, y, z))", "def max_of_three(a, b, c):\n    if a >= b and a >= c:\n        return a\n    elif b >= c:\n        return b\n    else:\n        return c\nx = int(input())\ny = int(input())\nz = int(input())\nprint(max_of_three(x, y, z))", "def max_of_three(a, b, c):\n    return max(a, b, c)\nprint(max_of_three(int(input()), int(input()), int(input())))"], "must": [["\\bdef\\b", "Define a function with def."], ["\\breturn\\b", "Your function should return the biggest number."]], "starter": "", "id": "12.54", "expect": ["9", "7", "10", "-1"]}, {"kind": "write", "unit": 12, "prompt": "Write a function <code>to_fahrenheit(c)</code> that converts Celsius to Fahrenheit: multiply by 9, divide by 5, add 32. Ask for a whole number of degrees Celsius and print the result. Typing 100 prints 212.0.", "solution": "def to_fahrenheit(c):\n    return c * 9 / 5 + 32\nc = int(input())\nprint(to_fahrenheit(c))", "tests": [{"stdin": ["100"], "expect": "212.0"}, {"stdin": ["0"], "expect": "32.0"}, {"stdin": "):\n    print(\"Hello, \" + name + \"!\")\nn = input()\ngreet(n)\ngreet()", "tests": [{"stdin": ["Mia"], "expect": "Hello, Mia!\nHello, friend!"}, {"stdin": ["Leo"], "expect": "Hello, Leo!\nHello, friend!"}, {"stdin": ["Zoe"], "expect": "Hello, Zoe!\nHello, friend!"}], "hints": ["The default goes in the def line: name=\"friend\"", "First call: greet(n). Second call: greet() with empty brackets."], "why": "The first call passes the typed name; the second uses the default \"friend\".", "skill": "funcs", "level": 2, "alts": ["def greet(name=\"friend\"):\n    print(\"Hello,\", name + \"!\")\ngreet(input())\ngreet()", "def greet(name=\"friend\"):\n    print(f\"Hello, {name}!\")\ngreet(input())\ngreet()", "def greet(name=\"friend\"):\n    print(\"Hello, \" + name + \"!\")\ngreet(name=input())\ngreet()"], "must": [["\\bdef\\s+greet\\s*\\(\\s*name\\s*=", "Give the parameter a default value in the def line."]], "starter": "", "id": "12.58", "expect": ["Hello, Mia!\nHello, friend!", "Hello, Leo!\nHello, friend!", "Hello, Zoe!\nHello, friend!"]}, {"kind": "write", "unit": 12, "prompt": "Write a function <code>clamp(score)</code> that keeps a score between 0 and 100: below 0 gives 0, above 100 gives 100, otherwise the score itself. Ask for a whole number and print clamp of it. Typing 150 prints 100.", "solution": "def clamp(score):\n    if score < 0:\n        return 0\n    if score > 100:\n        return 100\n    return score\nn = int(input())\nprint(clamp(n))", "tests": [{"stdin": ["150"], "expect": "100"}, {"stdin": ["-5"], "expect": "0"}, {"stdin": ["72"], "expect": "72"}, {"stdin": ["100"], "expect": "100"}, {"stdin": ["0"], "expect": "0"}], "hints": ["Use if inside the function.", "Check score < 0 first, then score > 100, and finally return score."], "why": "Each if returns early for a score that is too low or too high; any score in range reaches the last return.", "skill": "funcs", "level": 3, "alts": ["def clamp(score):\n    return max(0, min(100, score))\nprint(clamp(i ms))", "n = int(input())\nsmall = 1000000\nbig = -1000000\nfor i in range(n):\n    x = int(input())\n    if x < small:\n        small = x\n    if x > big:\n        big = x\nprint(\"Smallest:\", small)\nprint(\"Biggest:\", big)", "n = int(input())\nnums = []\nfor i in range(n):\n    nums.append(int(input()))\nnums.sort()\nprint(\"Smallest:\", nums[0])\nprint(\"Biggest:\", nums[-1])"], "must": [], "starter": "", "id": "13.4", "expect": ["Smallest: -2\nBiggest: 9", "Smallest: 4\nBiggest: 4", "Smallest: -8\nBiggest: -1", "Smallest: 7\nBiggest: 7", "Smallest: 3\nBiggest: 10"]}, {"kind": "write", "unit": 13, "prompt": "Ask for a word or sentence. Count the <b>vowels</b> (a, e, i, o, u - capital letters count too) and the <b>consonants</b> (every other <b>letter</b>; spaces, digits and symbols are neither). Print <b>Vowels: </b>the count, then <b>Consonants: </b>the count. For <b>Hello World</b> it prints Vowels: 3 and Consonants: 7.", "solution": "text = input().lower()\nvowels = 0\nconsonants = 0\nfor ch in text:\n    if ch in \"aeiou\":\n        vowels += 1\n    elif ch.isalpha():\n        consonants += 1\nprint(\"Vowels:\", vowels)\nprint(\"Consonants:\", consonants)", "tests": [{"stdin": ["Hello World"], "expect": "Vowels: 3\nConsonants: 7"}, {"stdin": ["python"], "expect": "Vowels: 1\nConsonants: 5"}, {"stdin": ["AEIOU"], "expect": "Vowels: 5\nConsonants: 0"}, {"stdin": ["Hi 5!"], "expect": "Vowels: 1\nConsonants: 1"}, {"stdin": ["rhythm"], "expect": "Vowels: 0\nConsonants: 6"}], "hints": ["Pattern: two counters in one loop. Make the text lowercase first so capitals count.", "elif ch.isalpha():  keeps spaces and symbols out of the consonants"], "why": "Check vowels first; any other character counts as a consonant only if it is a letter (isalpha). In Hello World: e, o, o are vowels and H, l, l, W, r, l, d are consonants; the space is neither.", "skill": "project", "level": 3, "alts": ["text = input()\nvowels = 0\nconsonants = 0\nfor ch in text:\n    if ch.isalpha():\n        if ch.lower() in \"aeiou\":\n            vowels += 1\n        else:\n            consonants += 1\nprint(\"Vowels:\", vowels)\nprint(\"Consonants:\", consonants)", "text = input()\nvowels = 0\nconsonants = 0\nfor ch in text:\n    if ch in \"aeiouAEIOU\":\n        vowels += 1\n    elif ch.isalpha():\n        consonants += 1\nprint(\"Vowels:\", vowels)\nprint(\"Consonants:\", consonants)", "text = input().lower()\nvowels = 0\nconsonants = 0\ni = 0\nwhile i < len(text):\n    if text[i] in \"aeiou\":\n        vowels += 1\n    elif text[i].isalpha():\n        consonants += 1\n    i += 1\nprint(\"Vowels:\", vowels)\nprint(\"Consonants:\", consonants)"], "must": [], "starter": "", "id": "13.5", "expect": ["Vowels: 3\nConsonants: 7", "Vowels: 1\nConsonants: 5", "Vowels: 5\nConsonants: 0", "Vowels: 1\nConsonants: 1", "Vowels: 0\nConsonants: 6"]}, {"kind": "write", "unit": 13, "prompt": "Ask for a word. If it reads the same forwards and backwards (ignore capital letters), print <b>Palindrome</b>. Otherwise print <b>Not a palindrome</b>. <b>Racecar</b> is a palindrome; <b>python</b> is not.", "solution": "w = input().lower()\nif w == w[::-1]:\n    print(\"Palindrome\")\nelse:\n    print(\"Not a palindrome\")", "tests": [{"stdin": ["level"], "expect": "Palindrome"}, {"stdin": ["Racecar"], "expect": "Palindrome"}, {"stdin": ["python"], "expect": "Not a palindrome"}, {"stdin": ["a"], "expect": "Palindrome"}, {"stdin": ["ab"], "expect": "Not a palindrome"}], "hints": ["Make the word lowercase first, then compare it with its reverse.", "w[::-1] is the word backwards"], "why": "Lowercase first so R and r match. w[::-1] is the word backwards, so level == level is True while python == nohtyp is False. A one-letter word is its own reverse.", "skill": "project", "level": 2, "alts": ["w = input().lower()\nback = \"\"\nfor ch in w:\n    back = ch + back\nif w == back:\n    print(\"Palindrome\")\nelse:\n    print(\"Not a palindrome\")", "w = input().lower()\nsame = True\nfor i in ra [i].isdigit():\n        has_digit = True\n    i += 1\nif len(pw) >= 8 and has_digit:\n    print(\"Strong\")\nelif len(pw) < 8:\n    print(\"Too short\")\nelse:\n    print(\"Needs a digit\")"], "must": [], "starter": "", "id": "13.7", "expect": ["Too short", "Needs a digit", "Strong", "Too short", "Strong"]}, {"kind": "write", "unit": 13, "prompt": "A shopping cart. Keep asking for item prices (whole numbers), one per line, until the user types <b>0</b>. (The 0 is not an item.) Then print <b>Items: </b>how many prices were typed and <b>Total: </b>their sum, on two lines.", "solution": "total = 0\nitems = 0\nprice = int(input())\nwhile price != 0:\n    total += price\n    items += 1\n    price = int(input())\nprint(\"Items:\", items)\nprint(\"Total:\", total)", "tests": [{"stdin": ["4", "10", "6", "0"], "expect": "Items: 3\nTotal: 20"}, {"stdin": ["0"], "expect": "Items: 0\nTotal: 0"}, {"stdin": ["5", "0"], "expect": "Items: 1\nTotal: 5"}, {"stdin": ["1", "2", "3", "4", "5", "0"], "expect": "Items: 5\nTotal: 15"}, {"stdin": ["100", "250", "0"], "expect": "Items: 2\nTotal: 350"}], "hints": ["Pattern: \"keep asking until\" = a while loop. Read once BEFORE the loop and once at the END of each pass.", "while price != 0:"], "why": "A counter and an accumulator work together. Reading once before the loop and again at the bottom means the 0 is never added or counted; if the first price is 0 the loop body never runs and both stay 0.", "skill": "project", "level": 2, "alts": ["total = 0\nitems = 0\nwhile True:\n    price = int(input())\n    if price == 0:\n        break\n    total += price\n    items += 1\nprint(\"Items:\", items)\nprint(\"Total:\", total)", "total = 0\nitems = 0\nprice = -1\nwhile price != 0:\n    price = int(input())\n    if price != 0:\n        total += price\n        items += 1\nprint(\"Items:\", items)\nprint(\"Total:\", total)"], "must": [], "starter": "", "id": "13.8", "expect": ["Items: 3\nTotal: 20", "Items: 0\nTotal: 0", "Items: 1\nTotal: 5", "Items: print(\"C\")\n    else:\n        print(\"F\")\nprint(\"Average:\", sum(scores) / n)"], "must": [], "starter": "", "id": "13.9", "expect": ["A\nB\nC\nAverage: 83.0", "A\nF\nAverage: 50.0", "F\nAverage: 69.0", "A\nB\nC\nF\nAverage: 80.0", "B\nC\nAverage: 75.5"]}, {"kind": "write", "unit": 13, "prompt": "Ask for a top temperature in Celsius (a whole number, 0 or more). Print one line for every 10 degrees from 0 up to that number (include the top if it is a multiple of 10), like <b>10 C = 50.0 F</b>. Formula: F = C * 9 / 5 + 32. Top 30 prints four lines.", "solution": "top = int(input())\nfor c in range(0, top + 1, 10):\n    print(c, \"C =\", c * 9 / 5 + 32, \"F\")", "tests": [{"stdin": ["30"], "expect": "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F"}, {"stdin": ["0"], "expect": "0 C = 32.0 F"}, {"stdin": ["50"], "expect": "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F\n40 C = 104.0 F\n50 C = 122.0 F"}, {"stdin": ["45"], "expect": "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F\n40 C = 104.0 F"}, {"stdin": ["100"], "expect": "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F\n40 C = 104.0 F\n50 C = 122.0 F\n60 C = 140.0 F\n70 C = 158.0 F\n80 C = 176.0 F\n90 C = 194.0 F\n100 C = 212.0 F"}], "hints": ["Pattern: a for loop that counts in steps of 10 (or a while loop that does c += 10).", "print(c, \"C =\", c * 9 / 5 + 32, \"F\")"], "why": "Counting 0, 10, 20 ... up to the top with a step of 10, each pass prints c and c * 9 / 5 + 32. Top 0 still prints one line (0 C = 32.0 F) and top 45 stops at 40 because 50 is too big.", "skill": "project", "level": 2, "alts": ["top = int(input())\nc = 0\nwhile c <= top:\n    print(c, \"C =\", c * 9 / 5 + 32, \"F\")\n    c += 10", "top = int(input())\nfor i in range(top // 10 + 1):\n    c = i * 10\n    print(c, \"C =\", c * 9 / 5 + 32, \"F\")"], "must": [], "starter": "", "id": "13.10", "expect": ["0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F", "0 C = 32.0 F", "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F\n40 C = 104.0 F\n50 C = 122.0 F", "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F\n40 C = 104.0 F", "0 C = 32.0 F\n10 C = 50.0 F\n20 C = 68.0 F\n30 C = 86.0 F\n40 C = 104.0 F\n50 C = 122.0 F\n60 C = 140.0 F\n70 C = 158.0 F\n80 C = 176.0 F\n90 C = 194.0 F\n100 C = 212.0 F"]}, {"kind": "write", "unit": 13, "prompt": "Ask for a whole number <b>N</b> (2 or more). Print <b>Prime</b> if only 1 and N divide it evenly, otherwise print <b>Not prime</b>. (7 is prime, 9 is not because 3 divides it.)", "solution": "n = int(input())\nprime = True\nfor d in range(2, n):\n    if n % d == 0:\n        prime = False\nif prime:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")", "tests": [{"stdin": ["2"], "expect": "Prime"}, {"stdin": ["9"], "expect": "Not prime"}, {"stdin": ["13"], "expect": "Prime"}, {"stdin": ["49"], "expect": "Not prime"}, {"stdin": ["97"], "expect": "Prime"}, {"stdin": ["4"], "expect": "Not prime"}], "hints": ["Pattern: a flag. Start with prime = True and try every divisor d from 2 up to N - 1.", "if n % d == 0:  prime = False"], "why": "Assume prime = True, then try d = 2, 3, ... N - 1. If any d divides N evenly (n % d == 0) the flag turns False. For 2 the range is empty so it stays Prime; for 49 the divisor 7 flips it.", "skill": "project", "level": 3, "alts": ["n = int(input())\ncount = 0\nfor d in range(1, n + 1):\n    if n % d == 0:\n        count += 1\nif count == 2:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")", "n = int(input())\nprime = True\nd = 2\nwhile d < n:\n    if n % d == 0:\n        prime = False\n        break\n    d += 1\nif prime:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")", "n = int(input())\nprime = True\nfor d in range(2, n):\n    if n % d == 0:\n        prime = False\n        break\nif prime:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")"], "must": [], "starter": "", "id": "13.11", "expect": ["Prime", "Not prime", "Prime", "Not prime", "Prime", "Not prime"]  in s:\n    if ch == \" \":\n        words += 1\nprint(words)", "s = input()\nwords = s.split()\ncount = 0\nfor w in words:\n    count += 1\nprint(count)"], "must": [], "starter": "", "id": "13.13", "expect": ["3", "1", "5", "6"]}, {"kind": "write", "unit": 13, "prompt": "Ask for a sentence. Print its <b>longest word</b>. If two words are equally long, print the one that comes <b>first</b>. <b>I love programming</b> prints programming.", "solution": "words = input().split()\nlongest = words[0]\nfor w in words:\n    if len(w) > len(longest):\n        longest = w\nprint(longest)", "tests": [{"stdin": ["I love programming"], "expect": "programming"}, {"stdin": ["cat dog rat"], "expect": "cat"}, {"stdin": ["a bb ccc dd"], "expect": "ccc"}, {"stdin": ["hello"], "expect": "hello"}, {"stdin": ["one three five seven"], "expect": "three"}], "hints": ["Pattern: find-the-biggest, but compare len(w) instead of the word itself.", "if len(w) > len(longest):  (use > not >= so the FIRST one wins a tie)"], "why": "Same shape as find-the-biggest, comparing lengths. Using > (not >=) means a tie never replaces the earlier word: in one three five seven, three and seven both have 5 letters, and three comes first.", "skill": "project", "level": 3, "alts": ["words = input().split()\nlongest = \"\"\nfor w in words:\n    if len(w) > len(longest):\n        longest = w\nprint(longest)", "words = input().split()\nlongest = words[0]\ni = 1\nwhile i < len(words):\n    if len(words[i]) > len(longest):\n        longest = words[i]\n    i += 1\nprint(longest)"], "must": [], "starter": "", "id": "13.14", "expect": ["programming", "cat", "ccc", "hello", "three"]}, {"kind": "write", "unit": 13, "prompt": "A tiny menu. Keep reading choices (one per line) until the user types <b>q</b>. A counter starts at 0. Choice <b>1</b> adds 1 to it, choice <b>2</b> subtracts 1, choice <b>3</b> prints <b>Count: </b>and the counter. Any other choice prints <b>Unknown choice</b>. When q is typed, print <b>Bye</b> and stop.", "solution": "count = 0\nchoice = input()\nwhile choice != \"q\":\n    if choice == \"1\":\n        count += 1\n    elif choice == \"2\":\n        count -= 1\n    elif choice == \"3\":\n        print(\"Count:\", count)\n    else:\n        print(\"Unknown choice\")\n    choice = input()\nprint(\"Bye\")", "tests": [{"stdin": ["1", "1", "3", "q"], "expect": "Count: 2\nBye"}, {"stdin": ["3", "q"], "expect": "Count: 0\nBye"}, {"stdin": ["q"], "expect": "Bye"}, {"stdin": ["1", "2", "2", "3", "x", "q"], "expect": "Count: -1\nUnknown choice\nBye"}, {"stdin": ["x", "3", "q"], "expect": "Unknown choice\nCount: 0\nBye"}], "hints": ["Pattern: a menu loop. Read a choice, keep going while it is not \"q\", and read the next choice at the END of each pass.", "The choices are TEXT: compare with \"1\", not 1."], "why": "A menu loop repeats until the quit key. The choices are text, so they are compared with \"1\", \"2\", \"3\" in quotes. Typing q first skips the loop and goes straight to Bye.", "skill": "project", "level": 3, "alts": ["count = 0\nwhile True:\n    choice = input()\n    if choice == \"q\":\n        break\n    if choice == \"1\":\n        count += 1\n    elif choice == \"2\":\n        count -= 1\n    elif choice == \"3\":\n        print(\"Count:\", count)\n    else:\n        print(\"Unknown choice\")\nprint(\"Bye\")", "count = 0\nwhile True:\n    choice = input()\n    if choice == \"q\":\n        print(\"Bye\")\n        break\n    elif choice == \"1\":\n        count += 1\n    elif choice == \"2\":\n        count -= 1\n    elif choice == \"3\":\n        print(\"Count:\", count)\n    else:\n        print(\"Unknown choice\")"], "must": [], "starter": "count = 0\n", "id": "13.15", "expect": ["Count: 2\nBye", "Count: 0\nBye", "Bye", "Count: -1\nUnknown choice\nBye", "Unknown choice\nCount: 0\nBye"]}, {"kind": "write", "unit": 13, "prompt": "Two players each type a move: <b>rock</b>, <b>paper</b> or <b>scissors</b> (all lowercase). Rock beats scissors, scissors beats pap  "write", "unit": 13, "prompt": "A guessing game with a fixed secret number: <b>7</b>. Keep reading guesses (whole numbers, one per line) until the guess is 7. For each wrong guess print <b>Too low</b> (the guess is below 7) or <b>Too high</b>. When the guess is 7 print <b>Correct! Tries: </b>N, where N counts <b>all</b> the guesses including the correct one.", "solution": "secret = 7\ntries = 1\nguess = int(input())\nwhile guess != secret:\n    if guess < secret:\n        print(\"Too low\")\n    else:\n        print(\"Too high\")\n    tries += 1\n    guess = int(input())\nprint(\"Correct! Tries:\", tries)", "tests": [{"stdin": ["7"], "expect": "Correct! Tries: 1"}, {"stdin": ["3", "10", "7"], "expect": "Too low\nToo high\nCorrect! Tries: 3"}, {"stdin": ["1", "2", "3", "4", "5", "6", "7"], "expect": "Too low\nToo low\nToo low\nToo low\nToo low\nToo low\nCorrect! Tries: 7"}, {"stdin": ["9", "8", "7"], "expect": "Too high\nToo high\nCorrect! Tries: 3"}, {"stdin": ["7", "3"], "expect": "Correct! Tries: 1"}], "hints": ["Pattern: \"keep asking until\" with a counter. Count the correct guess too.", "while guess != secret:"], "why": "The loop runs once per WRONG guess and counts it; the correct guess is counted by starting tries at 1. For 3, 10, 7: Too low, Too high, then Correct with 3 tries. After a 7 the program stops reading, so extra input is ignored.", "skill": "project", "level": 3, "alts": ["secret = 7\ntries = 0\nguess = -1\nwhile guess != secret:\n    guess = int(input())\n    tries += 1\n    if guess < secret:\n        print(\"Too low\")\n    elif guess > secret:\n        print(\"Too high\")\nprint(\"Correct! Tries:\", tries)", "secret = 7\ntries = 0\nwhile True:\n    guess = int(input())\n    tries += 1\n    if guess == secret:\n        break\n    elif guess < secret:\n        print(\"Too low\")\n    else:\n        print(\"Too high\")\nprint(\"Correct! Tries:\", tries)"], "must": [], "starter": "secret = 7\n", "id": "13.17", "expect": ["Correct! Tries: 1", "Too low\nToo high\nCorrect! Tries: 3", "Too low\nToo low\nToo low\nToo low\nToo low\nToo low\nCorrect! Tries: 7", "Too high\nToo high\nCorrect! Tries: 3", "Correct! Tries: 1"]}, {"kind": "write", "unit": 13, "prompt": "Ask for a whole number <b>N</b> from 1 to 9. Print N lines: line 1 is <b>1</b>, line 2 is <b>22</b>, line 3 is <b>333</b>, and so on up to line N. (N = 4 prints 1, 22, 333, 4444.)", "solution": "n = int(input())\nfor i in range(1, n + 1):\n    print(str(i) * i)", "tests": [{"stdin": ["1"], "expect": "1"}, {"stdin": ["3"], "expect": "1\n22\n333"}, {"stdin": ["5"], "expect": "1\n22\n333\n4444\n55555"}, {"stdin": ["9"], "expect": "1\n22\n333\n4444\n55555\n666666\n7777777\n88888888\n999999999"}], "hints": ["Pattern: \"for every\" line. Line i is the digit i written i times. Text times a number repeats it.", "print(str(i) * i)"], "why": "On pass i the line is the text of i repeated i times: str(3) * 3 is 333. Without str(), 3 * 3 would be the number 9. range(1, n + 1) makes the last line N.", "skill": "project", "level": 3, "alts": ["n = int(input())\nfor i in range(1, n + 1):\n    for j in range(i):\n        print(i, end=\"\")\n    print()", "n = int(input())\ni = 1\nwhile i <= n:\n    print(i * str(i))\n    i += 1", "n = int(input())\nfor i in range(1, n + 1):\n    line = \"\"\n    for j in range(i):\n        line = line + str(i)\n    print(line)"], "must": [], "starter": "", "id": "13.18", "expect": ["1", "1\n22\n333", "1\n22\n333\n4444\n55555", "1\n22\n333\n4444\n55555\n666666\n7777777\n88888888\n999999999"]}, {"kind": "fix", "unit": 13, "prompt": "It should print the <b>product</b> of N typed numbers (N first, then the numbers). 3 numbers 2, 3, 4 should print 24, but it always prints 0. Fix it.", "buggy": "n = int(input())\nproduct = 0\nfor i in range(n):\n    product = product * int(input())\nprint(product)", "solution": "n = int(input())\nproduct = 1\nfor i in range(n):\n    product = product * int(input())\nprint(product)", "tests": [{"stdin": ["3", "2", "3", "4"], "expect": "24"}, {"stdin": ["1", "5"], "expect": "5"}, {"stdin": ["2", "10", "10"], "expect": "100"}], "why": "Anything times 0 is 0, so a product that starts at 0 can never grow. A multiplying accumulator must start at 1 (an adding one starts at 0).", "skill": "project", "level": 2, "alts": [], "id": "13.19", "expect": ["24", "5", "100"]}, {"kind": "fix", "unit": 13, "prompt": "It should print the sum of 1 to N <b>including N</b> (N = 5 gives 15). It is always too small. Fix it.", "buggy": "n = int(input())\ntotal = 0\nfor i in range(1, n):\n    total += i\nprint(total)", "solution": "n = int(input())\ntotal = 0\nfor i in range(1, n + 1):\n    total += i\nprint(total)", "tests": [{"stdin": ["5"], "expect": "15"}, {"stdin": ["1"], "expect": "1"}, {"stdin": ["10"], "expect": "55"}], "why": "range(1, n) stops BEFORE n, so n is never added: for 5 it adds 1+2+3+4 = 10 instead of 15. range(1, n + 1) includes n.", "skill": "project", "level": 2, "alts": ["n = int(input())\ntotal = 0\nfor i in range(n + 1):\n    total += i\nprint(total)"], "id": "13.20", "expect": ["15", "1", "55"]}, {"kind": "fix", "unit": 13, "prompt": "It should count how many of the typed numbers are even. The program will not even start. Fix it.", "buggy": "n = int(input())\nevens = 0\nfor i in range(n):\n    x = int(input())\n    if x % 2 = 0:\n        evens += 1\nprint(\"Evens:\", evens)", "solution": "n = int(input())\nevens = 0\nfor i in range(n):\n    x = int(input())\n    if x % 2 == 0:\n        evens += 1\nprint(\"Evens:\", evens)", "tests": [{"stdin": ["3", "2", "5", "8"], "expect": "Evens: 2"}, {"stdin": ["2", "1", "3"], "expect": "Evens: 0"}, {"stdin": ["1", "4"], "expect": "Evens: 1"}], "why": "One = stores a value; two == asks a question. An if needs the question, so x % 2 == 0 is right and x % 2 = 0 is a SyntaxError.", "skill": "project", "level": 2, "alts": [], "id": "13.21", "expect": ["Evens: 2", "Evens: 0", "Evens: 1"]}, {"kind": "fix", "unit": 13, "prompt": "It should say <b>Great job!</b> for a score of 90 or more and <b>Keep practicing</b> otherwise, but it crashes. Fix it.", "buggy": "score = input()\nif score >= 90:\n    print(\"Great job!\")\nelse:\n    print(\"Keep practicing\")", "solution": "score = int(input())\nif score >= 90:\n    print(\"Great job!\")\nelse:\n    print(\"Keep practicing\")", "tests": [{"stdin": ["95"], "expect": "Great job!"}, {"stdin": ["90"], "expect": "Great job!"}, {"stdin": ["72"], "expect": "Keep practicing"}, {"stdin": ["100"], "expect": "Great job!"}], "why": "input() gives TEXT, and a text cannot be compared with the number 90 (TypeError). Wrap it in int() when you read it.", "skill": "project", "level": 2, "alts": [], "id": "13.22", "expect": ["Great job!", "Great job!", "Keep practicing", "Great job!"]}, {"kind": "fix", "unit": 13, "prompt": "This should print <b>even</b> or <b>odd</b> for the typed number. For 4 it prints True and then odd! Fix the function.", "buggy": "def is_even(n):\n    print(n % 2 == 0)\n\nn = int(input())\nif is_even(n):\n    print(\"even\")\nelse:\n    print(\"odd\")", "solution": "def is_even(n):\n    return n % 2 == 0\n\nn = int(input())\nif is_even(n):\n    print(\"even\")\nelse:\n    print(\"odd\")", "tests": [{"stdin": ["4"], "expect": "even"}, {"stdin": ["7"], "expect": "odd"}, {"stdin": ["10"], "expect": "even"}, {"stdin": ["0"], "expect": "even"}], "why": "print only SHOWS the answer; the function hands back None, which counts as False in the if, so it always said odd. return gives the answer back to the caller.", "skill": "project", "level": 2, "alts": [], "id": "13.23", "expect": ["even", "odd", "even", "even"]}, {"kind": "fix", "unit": 13, "prompt": "It should print the total <b>once</b>, after all the numbers (N first, then N numbers). Right now it prints a line after every number. Fix it.", "buggy": "n = int(input())\ntotal = 0\nfor i in range(n):\n    x = int(input())\n    total += x\n    print(\"Total:\", total)", "solution": "n = int(input())\ntotal = 0\nfor i in range(n):\n    x = int(input())\n    total += x\nprint(\"Total:\", total)", "tests": [{"stdin": ["3", "1", "2", "3"], "expect": "Total: 6"}, {"stdin": ["1", "5"], "expect": "Total: 5"}, {"stdin": ["4", "10", "20", "30", "40"], "expect": "Total: 100"}], "why": "Indented lines belong to the loop body and run every pass. For 1, 2, 3 the buggy print runs three times (1, 3, 6). Move print back to the left edge so it runs once, after the loop.", "skill": "project", "level": 3, "alts": [], "id": "13.24", "expect": ["Total: 6", "Total: 5", "Total: 100"]}, {"kind": "fix", "unit": 13, "prompt": "It should count down from N to 1 and then print <b>Liftoff!</b>. For N = 3 it must print 3, 2, 1, Liftoff! but the 1 is missing. Fix it.", "buggy": "n = int(input())\nfor i in range(n, 1, -1):\n    print(i)\nprint(\"Liftoff!\")", "solution": "n = int(input())\nfor i in range(n, 0, -1):\n    print(i)\nprint(\"Liftoff!\")", "tests": [{"stdin": ["3"], "expect": "3\n2\n1\nLiftoff!"}, {"stdin": ["5"], "expect": "5\n4\n3\n2\n1\nLiftoff!"}, {"stdin": ["1"], "expect": "1\nLiftoff!"}], "why": "range stops BEFORE its end value. Counting down, range(n, 1, -1) stops before 1 so it is never printed; range(n, 0, -1) stops before 0 so 1 is included. For N = 1 the buggy loop printed nothing at all.", "skill": "project", "level": 3, "alts": ["n = int(input())\nfor i in range(n):\n    print(n - i)\nprint(\"Liftoff!\")"], "id": "13.25", "expect": ["3\n2\n1\nLiftoff!", "5\n4\n3\n2\n1\nLiftoff!", "1\nLiftoff!"]}, {"kind": "fix", "unit": 13, "prompt": "It should print <b>Prime</b> or <b>Not prime</b>. But it says Prime for 9 and 15! The loop stops too early. Fix it.", "buggy": "n = int(input())\nprime = True\nfor d in range(2, n):\n    if n % d == 0:\n        prime = False\n    break\nif prime:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")", "solution": "n = int(input())\nprime = True\nfor d in range(2, n):\n    if n % d == 0:\n        prime = False\n        break\nif prime:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")", "tests": [{"stdin": ["9"], "expect": "Not prime"}, {"stdin": ["7"], "expect": "Prime"}, {"stdin": ["15"], "expect": "Not prime"}, {"stdin": ["4"], "expect": "Not prime"}], "why": "The break is at the loop level, so it ends the loop after the very first d (2) whatever happened. 9 % 2 is 1, the loop stopped, and 9 stayed Prime. Indent break under the if, or delete it.", "skill": "project", "level": 3, "alts": ["n = int(input())\nprime = True\nfor d in range(2, n):\n    if n % d == 0:\n        prime = False\nif prime:\n    print(\"Prime\")\nelse:\n    print(\"Not prime\")"], "id": "13.26", "expect": ["Not prime", "Prime", "Not prime", "Not prime"]}, {"kind": "typed", "unit": 13, "code": "def shout(word):\n    return word.upper() + \"!\"\n\nfor name in [\"ana\", \"leo\"]:\n    print(shout(name))", "why": "The loop gives the function \"ana\" then \"leo\". Each call returns the word in capitals plus ! , so the lines are ANA! and LEO!.", "stdin": [], "skill": "project", "level": 1, "id": "13.27", "answer": "ANA!\nLEO!"}, {"kind": "typed", "unit": 13, "code": "total = 0\ncount = 0\nprice = int(input())\nwhile price != 0:\n    total += price\n    count += 1\n    price = int(input())\nprint(count, total)", "why": "The prices 4, 6, 10 are added (total 20) and counted (3). The 0 stops the loop before it is added. print with a comma shows 3 20.", "stdin": ["4", "6", "10", "0"], "skill": "project", "level": 2, "id": "13.28", "answer": "3 20"}, {"kind": "typed", "unit": 13, "code": "def is_pal(w):\n    return w == w[::-1]\n\nfor w in [\"noon\", \"moon\", \"a\"]:\n    print(w, is_pal(w))", "why": "noon backwards is noon (True), moon backwards is noom (False), and a one-letter word is its own reverse (True). Each line shows the word, a space, then the answer.", "stdin": [], "skill": "project", "level": 2, "id": "13.29", "answer": "noon True\nmoon False\na True"}, {"kind": "typed", "unit": 13, "code": "nums = [4, 9, 2, 7, 5]\nbig = nums[0]\nfor n in nums:\n    if n > big:\n        big = n\n    print(big)", "why": "big starts at 4. The print is inside the loop, so it shows big after EVERY number: 4, then 9 (9 is bigger), then 9, 9, 9 because 2, 7 and 5 are not bigger than 9.", "stdin": [], "skill": "project", "level": 3, "id": "13.30", "answer": "4\n9\n9\n9\n9"}, {"kind": "typed", "unit": 13, "code": "def initials(names):\n    result = \"\"\n    for n in names:\n        result += n[0].upper()\n    return result\n\nprint(initials([\"ada\", \"bob\", \"cy\"]))\nprint(len(initials([\"x\", \"y\"])))", "why": "Each name gives its first letter in capitals: A, B, C glued to ABC. The second call builds XY, and len(\"XY\") is 2, so the second line is the number 2.", "stdin": [], "skill": "project", "level": 3, "id": "13.31", "answer": "ABC\n2"}, {"kind": "typed", "unit": 13, "code": "secret = 7\ntries = 0\nguess = int(input())\nwhile guess != secret:\n    tries += 1\n    if guess < secret:\n        print(\"low\")\n    else:\n        print(\"high\")\n    guess = int(input())\nprint(\"tries:\", tries)", "why": "The guesses 3 and 9 are wrong: 3 is below 7 (low), 9 is above (high). Each wrong guess adds 1, so tries is 2. The 7 ends the loop without being counted.", "stdin": ["3", "9", "7"], "skill": "project", "level": 3, "id": "13.32", "answer": "low\nhigh\ntries: 2"}, {"kind": "out", "unit": 13, "code": "def has_digit(s):\n    for ch in s:\n        if ch.isdigit():\n            return True\n    return False\n\nprint(has_digit(\"abc\"), has_digit(\"a1\"))", "why": "has_digit(\"abc\") checks a, b, c, finds no digit and reaches the last return: False. has_digit(\"a1\") returns True as soon as it meets 1. So print shows False True.", "stdin": [], "skill": "project", "level": 2, "id": "13.33", "options": ["False True", "True True", "True False", "False False"]}, {"kind": "out", "unit": 13, "code": "word = input()\ncount = 0\nfor ch in word:\n    if ch in \"aeiou\":\n        count += 1\nprint(word, count)", "why": "The test only knows lowercase vowels, so the capital E is skipped. Only u, a, i, o count: 4. The word has 5 vowels, but this program says 4.", "stdin": ["Education"], "skill": "project", "level": 3, "id": "13.34", "options": ["Education 4", "Education 5", "Education 3", "Education 9"]}, {"kind": "out", "unit": 13, "code": "for i in range(1, 8):\n    if i % 2 == 0:\n        continue\n    if i > 5:\n        break\n    print(i)", "why": "continue skips the even numbers 2, 4, 6. The odd numbers 1, 3, 5 are printed. At 7, i > 5 is true so break ends the loop BEFORE the print: output 1, 3, 5.", "stdin": [], "skill": "project", "level": 2, "id": "13.35", "options": ["1\n3\n5", "1\n3\n5\n7", "2\n4\n6", "1\n3"]}, {"kind": "out", "unit": 13, "code": "count = 0\nchoice = input()\nwhile choice != \"q\":\n    if choice == \"1\":\n        count += 1\n    elif choice == \"2\":\n        count -= 1\n    choice = input()\nprint(count)", "why": "The choices 1, 1, 2, 1 change count: +1, +1, -1, +1 = 2. The q is not 1 or 2 and ends the loop, and the final print shows 2.", "stdin": ["1", "1", "2", "1", "q"], "skill": "project", "level": 2, "id": "13.36", "options": ["2", "3", "4", "5"]}, {"kind": "line", "unit": 13, "code": "n = int(input())\ntotal = 0\nfor i in range(n):\n    total += int(input())\nprint(\"Average:\", total / count)", "why": "The loop reads fine (4 + 6), but the last line uses a variable called count that was never created. That is a NameError on line 5.", "stdin": ["2", "4", "6"], "skill": "project", "level": 2, "id": "13.37", "nlines": 5, "answer": 4, "errtype": "NameError"}, {"kind": "line", "unit": 13, "code": "def average(a, b):\n    return (a + b) / 2\n\nx = int(input())\ny = int(input())\nprint(average(x))", "why": "The function needs TWO values but the call average(x) gives only one. Python crashes with a TypeError at the call, on line 6.", "stdin": ["4", "6"], "skill": "project", "level": 3, "id": "13.38", "nlines": 6, "answer": 5, "errtype": "TypeError"}, {"kind": "line", "unit": 13, "code": "scores = [90, 80, 70]\ntotal = 0\nfor i in range(len(scores) + 1):\n    total += scores[i]\nprint(total)", "why": "The list has 3 items (positions 0, 1, 2), but range(4) also gives i = 3. scores[3] does not exist: IndexError on line 4, inside the loop.", "stdin": [], "skill": "project", "level": 3, "id": "13.39", "nlines": 5, "answer": 3, "errtype": "IndexError"}, {"kind": "know", "unit": 13, "q": "The spec says: \"Show HOW MANY numbers in the list are bigger than 10.\" Which pattern does it need?", "opts": ["A counter: start at 0, add 1 when the test is true", "An accumulator: add every number to a running total", "Find the biggest: keep the largest number seen so far", "A menu loop: repeat until the user types a quit key"], "why": "\"How many\" means counting. Start count at 0 and do count += 1 only when a number is bigger than 10. An accumulator adds the values themselves, which is a different question.", "skill": "project", "code": "", "level": 1, "id": "13.40"}, {"kind": "know", "unit": 13, "q": "A program must keep asking for a password until the user types the right one. Which loop fits best?", "opts": ["A while loop, because nobody knows how many tries it takes", "A for loop with range(10), because ten tries is plenty", "An if statement, because it only has to check one time", "No loop, because input() repeats itself until it is right"], "why": "\"Keep asking until\" means we do not know how many times in advance. A while loop checks the condition each time. A for loop needs a fixed count, and an if checks only once.", "skill": "project", "code": "", "level": 1, "id": "13.41"}, {"kind": "know", "unit": 13, "q": "When finding the biggest of N typed numbers, why start big as the FIRST number instead of 0?", "opts": ["If every number is negative, 0 would wrongly stay the biggest", "Python gives an error when a variable starts at the number 0", "The loop cannot run when big is smaller than the first number", "The first number y  1: text needs quotes", "Anything in <b>quotes</b> is <b>text</b> (Python calls it a <b>str</b>). Python prints the text exactly as written. <b>The quotes are not printed.</b>"], ["show", "print(\"Hello\")\nprint('Hello')", [], "Hello\nHello", null], ["p", "Double quotes <code>\" \"</code> and single quotes <code>' '</code> both work. Just close with the same kind you opened with."], ["rule", "Rule 2: numbers have NO quotes", "A number without quotes is a number, so Python can do <b>math</b> with it. With quotes it is just text."], ["show", "print(2 + 3)\nprint(\"2 + 3\")", [], "5\n2 + 3", null], ["trap", "<b>The classic trap:</b> <code>print(\"2 + 3\")</code> prints <code>2 + 3</code>. <code>print(2 + 3)</code> prints <code>5</code>. Quotes = no math."], ["quick", "What does print(\"10 - 4\") show?", ["10 - 4", "6", "Error", "\"10 - 4\""], 0, "It is in quotes, so it is text and is printed as is."], ["h", "Putting several things in one print"], ["p", "Put a <b>comma</b> between things. Python prints them with <b>one space</b> between. You can mix text and numbers."], ["show", "print(\"I am\", 11, \"years old\")\nprint(\"Score:\", 5 + 5)", [], "I am 11 years old\nScore: 10", null], ["p", "Or use <b>+</b> to <b>glue text to text</b>. + adds <b>no space</b> - you have to put the space in the quotes yourself."], ["show", "print(\"Good\" + \"bye\")\nprint(\"Good \" + \"morning\")\nprint(\"5\" + \"5\")", [], "Goodbye\nGood morning\n55", null], ["trap", "<b>+ with two numbers adds. + with two texts glues.</b> <code>5 + 5</code> is 10, but <code>\"5\" + \"5\"</code> is 55. And <b>text + number is an ERROR</b>: <code>print(\"Age: \" + 11)</code> crashes. Use a comma instead: <code>print(\"Age:\", 11)</code>."], ["try", "print(\"Age:\", 11)\nprint(\"Age: \" + 11)", [], "Run it. The first line works, the second crashes. Read the red error message!"], ["h", "Many lines"], ["p", "Every <code>print()</code> starts a <b>new line</b>. Python reads your program from the top to the b ct each line first, then Run."], ["show", "print(\"banana\".find(\"n\"))\nprint(\"banana\".find(\"z\"))\nprint(\"12\".isdigit())\nprint(\"1.5\".isdigit())", [], "2\n-1\nTrue\nFalse", null], ["p", "<code>find</code> does not crash when it finds nothing. It gives <b>-1</b>. That means \"not found\". Position 0 is a real position (the first letter), so do NOT use find as a True/False check."], ["rule", "Methods do NOT change the original", "Strings cannot be changed. <code>text.upper()</code> makes a <b>new</b> string and the old one stays the same. To keep the new one, store it: <code>text = text.upper()</code>."], ["try", "name = \"sam\"\nname.upper()\nprint(name)\nname = name.upper()\nprint(name)", [], "The first print shows the old name. Why? Run it and see."], ["trap", "<b>You cannot change one letter.</b> <code>word[0] = \"X\"</code> is a <b>TypeError</b>. Build a new string instead: <code>word = \"X\" + word[1:]</code>."], ["h", "5. Checking and combining"], ["p", "The word <code>in</code> asks \"is this piece inside that text?\" and answers True or False. It is case-sensitive: <code>\"A\"</code> is not <code>\"a\"</code>. You can also glue with <code>+</code> and repeat with <code>*</code>."], ["show", "print(\"a\" in \"cat\")\nprint(\"A\" in \"cat\")\nprint(\"ab\" + \"cd\")\nprint(\"ab\" * 3)", [], "True\nFalse\nabcd\nababab", null], ["p", "A <code>for</code> loop can visit the letters of a word one at a time. Combine it with <code>in</code> to count vowels."], ["trace", "count = 0\nfor ch in \"cat\":\n    if ch in \"aeiou\":\n        count += 1\nprint(count)", []], ["try", "text = input(\"Type digits: \")\nif text.isdigit():\n    print(int(text) + 1)\nelse:\n    print(\"That is not a number\")", ["41"], "Try <code>41</code>, then <code>4a</code>, then <code>2.5</code>. isdigit() protects int() from crashing."], ["h", "Common mistakes"], ["table", ["Mistake", "What happens"], [["<code>word[len(word)]</code> (off by one)", "IndexError"], ["<code>word[0] = \"X\" urn, and know where variables live.", "cando": ["I can write a function with def and call it", "I can use parameters, default values and several arguments", "I know return gives a value back and print only shows it", "I know a variable made inside a function stays inside it"], "blocks": [["p", "Imagine you want to print a birthday card message for ten friends. You could copy the same <code>print</code> lines ten times. Or you can write the steps <b>once</b>, give them a <b>name</b>, and use that name whenever you need them. That named recipe is a <b>function</b>. You already use functions: <code>print()</code>, <code>input()</code> and <code>int()</code> are all functions somebody else wrote."], ["h", "Making a function: def"], ["try", "def greet():\n    print(\"Hello!\")\n    print(\"Welcome to my program.\")\n\ngreet()\ngreet()", [], "Run it. Then add a third <code>greet()</code> line at the bottom and run again."], ["rule", "def + a name + brackets + colon + an indented body", "Start with <code>def</code>, the name, <code>()</code> and a <b>colon</b>. Everything <b>indented</b> underneath is the <b>body</b>: the steps of the recipe. To use the function you <b>call</b> it by writing its name with brackets: <code>greet()</code>."], ["trap", "<b>def does NOT run the function.</b> It only teaches Python the recipe. Nothing happens until a line <i>calls</i> it. And the brackets matter: <code>greet</code> alone does nothing, <code>greet()</code> runs it."], ["try", "def greet():\n    print(\"Hello!\")\n\nprint(\"A\")\ngreet\nprint(\"B\")", [], "Predict first: does \"Hello!\" show? Then run. Now add the brackets to <code>greet</code> and run again."], ["p", "Python reads from the top down, so <b>define first, call later</b>. Calling a function before its <code>def</code> has run is a NameError."], ["h", "Parameters: give the function something to work with"], ["p", "A function that always does the same thing is not very useful. Put a variable name inside the brackets and the function can work with different values each time. That variable is a <b>parameter</b>. The value you pass in the call is the <b>argument</b>."], ["try", "def greet(name):\n    print(\"Hello,\", name)\n\ngreet(\"Ana\")\ngreet(\"Leo\")\ngreet(input())", ["Mia"], "Each call gives <code>name</code> a new value. Change the names and run."], ["p", "With several parameters, the arguments go in <b>order</b>: the first argument goes to the first parameter. You can also say the names yourself (<code>b=1, a=10</code>); then the order does not matter. You can give a parameter a <b>default value</b>, and then you may leave that argument out."], ["show", "def subtract(a, b):\n    print(a - b)\n\nsubtract(10, 4)\nsubtract(4, 10)\nsubtract(b=1, a=10)\n\ndef power(base, exp=2):\n    print(base ** exp)\n\npower(5)\npower(2, 3)", [], "6\n-6\n9\n25\n8", null], ["trap", "The number of arguments must fit. <code>def add(a, b)</code> called as <code>add(1)</code> or <code>add(1, 2, 3)</code> is a <b>TypeError</b>. Python does not guess the missing value."], ["h", "return vs print - the big one"], ["p", "<code>print()</code> <b>shows</b> something on the screen. But often you want a function to <b>give an answer back</b> so the rest of the program can use it. That is what <code>return</code> does."], ["show", "def add(a, b):\n    return a + b\n\nx = add(2, 3)\nprint(x)\nprint(add(10, 20) * 2)", [], "5\n60", null], ["trace", "def add(a, b):\n    return a + b\n\nx = add(2, 3)\ny = x * 10\nprint(y)", []], ["rule", "return gives a value back; print only shows it", "<code>return a + b</code> sends the answer back to the line that called the function, where you can store it (<code>x = add(2, 3)</code>) or use it in more math. <b>return also ends the function</b>: any line after it never runs. A function with <b>no return</b> gives back <code>None</code>. So in a function that has <code>return \"A\"</code> on one line and <code>print(\"B\")</code> on the next, the print never happens."], [" /* ---------- run a program silently with prepared input -> transcript ---------- */
async function silentRun(code, stdin) {

  const q = (stdin || []).slice(); const parts = [];
  const res = await PF.run(code, {
    limit: 400000, write: s => parts.push({ t: 'out', s }),
    input: async p => { if (p) parts.push({ t: 'out', s: p }); if (!q.length) return null; const v = q.shift(); parts.push({ t: 'in', s: v + '\n' }); return v; },
  });

}

  const box = h('div', { class: 'term term-static', role: 'region', 'aria-label': 'Program output' });
  for (const p of tr.parts) box.append(h('span', { class: p.t === 'in' ? 'term-typed' : '' }, p.s));
  if (tr.res.error) {
    box.append(h('div', { class: 'term-err' }, h('pre', null, tracebackText(tr.res.error, code))));
  }
  if (!tr.parts.length && !tr.res.error) box.append(h('span', { class: 'muted' }, '(nothing was printed)'));

}

      h('div', { class: 'hud', id: 'hud' }), h('a', { class: 'icon-btn cheat-link', href: '#/cheat', title: 'Cheat sheet' }, icon('sheet'), h('span', { class: 'sr-only' }, 'Cheat sheet')), themeBtn),

function paintTheme() { const b = $('#theme'); if (!b) return; const [ic, label] = THEME_LABEL[Store.data.theme]; b.textContent = ''; b.append(icon(ic)); b.setAttribute('aria-label', label); b.title = label + ' (tap to change)'; }
function paintChrome(bump) {                 // streak + level pills in the header

window.paintChrome = paintChrome;
function setActive(hash) {
  const skill = (/^#\/skill\/(\w+)/.exec(hash) || [])[1];
  const isLevel = hash.startsWith('#/level') || /^#\/(learn|drill)\/(7|8|9|1[0-3])$/.test(hash) || /^#\/(weak|mixed|kind\/(fix|write))\/level/.test(hash) || (skill && LEVEL_SKILLS.includes(skill));
  const practiceLike = /^#\/(practice|skill|weak|mixed|kind|endless|sprint|drill)/.test(hash);
  $$('.nav-a', navEl).forEach(a => {
    const to = a.dataset.to; let on;
    if (to === '#/') on = hash === '#/' || hash === '' || hash === '#';
    else if (to === '#/level') on = isLevel;
    else if (to === '#/learn') on = hash.startsWith('#/learn') && !isLevel;
    else if (to === '#/practice') on = practiceLike && !isLevel;
    else on = hash.startsWith(to);

}
async function route() {
  const hash = location.hash || '#/'; const view = $('#view'); view.textContent = '';
  const parts = hash.replace(/^#\/?/, '').split('/'); const [a, b, c] = parts;

    if (!a) node = HomeView();
    else if (a === 'learn') { node = b ? LessonView(+b) : LearnView(); title = b ? 'Lesson ' + b : 'Lessons'; }

    else if (a === 'skill') { const pool = ITEMS.filter(i => i.skill === b); node = PracticeSession({ title: SKILL_NAMES[b] || b, items: mixPool(pool, 14), meta: { kind: 'skill' } }); isSession = true; }
    else if (a === 'weak') { const lv = b === 'level'; const w = weakItems(14, lv ? 'level' : 'test'); node = PracticeSession({ title: lv ? 'Level Up weak spots' : 'Weak-spot rescue', items: w.items, meta: { kind: 'weak' }, backHref: lv ? '#/level' : '#/practice' }); isSession = true; }
    else if (a === 'mixed') { const lv = b === 'level'; node = PracticeSession({ title: lv ? 'Level Up mixed practice' : 'Mixed practice', items: mixPool(ITEMS.filter(i => unitTrack(i.unit) === (lv ? 'level' : 'test')), 15), meta: { kind: 'mixed' } }); isSession = true; }
    else if (a === 'kind') { const k = b === 'write' ? 'write' : 'fix'; const lv = c === 'level'; node = PracticeSession({ title: (lv ? 'Level Up ' : '') + (k === 'fix' ? 'bug hunt' : 'code writer'), items: mixPool(ITEMS.filter(i => i.kind === k && unitTrack(i.unit) === (lv ? 'level' : 'test')), 8), meta: { kind: k } }); isSession = true; }
    else if (a === 'endless') { node = await EndlessSession(12); isSession = true; }
    else if (a === 'sprint') { node = await TypeSprint(); isSession = true; }
    else if (a === 'test' || a === 'leveltest') {
      const track = a === 'test' ? 'test' : 'level'; const size = +b >= 20 ? 20 : 10; const mins = track === 'test' ? (size >= 20 ? 30 : 15) : (size >= 20 ? 40 : 20);
      title = track === 'test' ? 'Mock test' : 'Level Up checkpoint';
      if (a === 'test' && !b) { node = TestHubView(); }

        const saved = pendingMock(); isSession = true;

    else if (a === 'cheat') { node = CheatView(b); title = 'Cheat sheet'; }

  } catch (err) {
    console.error(err); node = h('div', { class: 'card' }, h('h2', null, 'Oops, something broke'), h('p', null, String(err && err.message || err)), h('a', { class: 'btn', href: '#/' }, 'Home'));
  }

  view.append(node); document.title = title === 'Python Test Prep' ? title : title + ' · Python Test Prep'; setActive(hash);

/* on-screen keyboard: when it opens, stop floating the action bar over the input */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const upd = () => { if (vv.scale && Math.abs(vv.scale - 1) > .01) { document.body.classList.remove('kbd-open'); document.documentElement.style.setProperty('--kb', '0px'); return; }   // pinch-zoom is not a keyboard
    const ae = document.activeElement; const typing = ae && /^(input|textarea|select)$/i.test(ae.tagName); const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', kb + 'px'); const open = !!typing && kb > 100; const was = document.body.classList.contains('kbd-open'); document.body.classList.toggle('kbd-open', open);
